name: Verify and publish atlas
on:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'pipeline/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest tests -q
      - run: node --test tests/*.test.js
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory atlas > /tmp/hynt-preview.log 2>&1 &
          python tests/browser_smoke.py http://127.0.0.1:8000
          python tests/technology_regions_smoke.py http://127.0.0.1:8000
          python tests/events_smoke.py http://127.0.0.1:8000
          python tests/religion_smoke.py http://127.0.0.1:8000
          python tests/focus_ranking_smoke.py http://127.0.0.1:8000
          python tests/review_polish_smoke.py http://127.0.0.1:8000
          python tests/device_check_smoke.py http://127.0.0.1:8000
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: atlas
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static atlas
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
